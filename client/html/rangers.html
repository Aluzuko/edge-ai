<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rangers - Wildlife detection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div id="nav"></div>

  <div class="container-fluid py-3">
    <h4 class="mb-3"><i class="bi bi-people me-2"></i>Rangers</h4>

    <div class="card mb-4">
      <div class="card-body">
        <h6 class="card-title">Add ranger</h6>
        <div class="row g-2 align-items-end">
          <div class="col-md-4">
            <label class="form-label">Name</label>
            <input type="text" id="nameInput" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">Contact</label>
            <input type="text" id="contactInput" class="form-control">
          </div>
          <div class="col-md-4">
            <button id="addBtn" class="btn btn-primary w-100" disabled>
              <i class="bi bi-plus-lg me-1"></i><span id="addBtnText">Add ranger</span>
            </button>
          </div>
        </div>
        <div id="errorAlert" class="alert alert-danger mt-3 mb-0" style="display:none;"></div>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>Name</th>
            <th>Contact</th>
          </tr>
        </thead>
        <tbody id="rangersBody">
          <tr><td colspan="2" class="text-center text-muted py-4">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/rangers.js"></script>
</body>
</html>
