<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Requests - Wildlife detection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div id="nav"></div>

  <div class="container-fluid py-3">
    <h4 class="mb-3"><i class="bi bi-bell me-2"></i>Species requests</h4>

    <div class="card mb-4">
      <div class="card-body">
        <h6 class="card-title">New request</h6>
        <div class="row g-2 align-items-end">
          <div class="col-md-3">
            <label class="form-label">Ranger</label>
            <select id="rangerSelect" class="form-select">
              <option value="" disabled selected>Select ranger</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Species</label>
            <select id="speciesSelect" class="form-select">
              <option value="" disabled selected>Select species</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Camera (optional)</label>
            <select id="cameraSelect" class="form-select">
              <option value="">Any camera</option>
            </select>
          </div>
          <div class="col-md-3">
            <button id="createBtn" class="btn btn-primary w-100" disabled>
              <i class="bi bi-plus-lg me-1"></i><span id="createBtnText">Create request</span>
            </button>
          </div>
        </div>
        <div id="errorAlert" class="alert alert-danger mt-3 mb-0" style="display:none;"></div>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-2">
      <h6 class="mb-0">All requests</h6>
      <select id="statusFilter" class="form-select w-auto">
        <option value="">All statuses</option>
        <option value="pending">Pending</option>
        <option value="seen">Seen</option>
        <option value="expired">Expired</option>
      </select>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>Status</th>
            <th>Species</th>
            <th>Camera</th>
            <th>Ranger</th>
            <th>Created</th>
            <th>Fulfilled</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="requestsBody">
          <tr><td colspan="7" class="text-center text-muted py-4">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/requests.js"></script>
</body>
</html>
