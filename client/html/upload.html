<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Upload - Wildlife detection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div id="nav"></div>

  <div class="container py-3" style="max-width: 640px;">
    <h4 class="mb-3"><i class="bi bi-cloud-upload me-2"></i>Upload image</h4>

    <div class="mb-3">
      <label class="form-label">Camera</label>
      <select id="cameraSelect" class="form-select">
        <option value="" disabled selected>Select a camera</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Image file</label>
      <input type="file" id="fileInput" class="form-control" accept="image/jpeg,image/png">
    </div>

    <button id="uploadBtn" class="btn btn-primary" disabled>
      <i class="bi bi-upload me-1"></i><span id="uploadBtnText">Upload</span>
    </button>

    <div id="errorAlert" class="alert alert-danger mt-3" style="display:none;"></div>

    <div id="uploadedSection" class="mt-4" style="display:none;">
      <h5>Uploaded</h5>
      <img id="uploadedImg" class="img-fluid img-thumbnail mb-3" style="max-height: 300px;">
      <div>
        <button id="detectBtn" class="btn btn-outline-primary">
          <i class="bi bi-cpu me-1"></i><span id="detectBtnText">Detect now</span>
        </button>
      </div>
      <div id="detectionResult" class="alert alert-success mt-3" style="display:none;"></div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/upload.js"></script>
</body>
</html>
