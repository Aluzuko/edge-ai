<div class="container-fluid py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-binoculars me-2"></i>Detections</h4>
    <select class="form-select w-auto" [(ngModel)]="selectedSpeciesId" (ngModelChange)="onSpeciesChange()">
      <option [ngValue]="null">All species</option>
      <option *ngFor="let s of species" [ngValue]="s.species_id">{{ s.common_name }}</option>
    </select>
  </div>
  <ag-grid-angular
    class="w-100"
    style="height: 600px;"
    [rowData]="rowData"
    [columnDefs]="colDefs"
    [theme]="theme"
    [pagination]="true"
    [paginationPageSize]="20">
  </ag-grid-angular>
</div>
