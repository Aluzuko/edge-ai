<div class="container-fluid py-3">
  <h4 class="mb-3"><i class="bi bi-people me-2"></i>Rangers</h4>

  <div class="card mb-4">
    <div class="card-body">
      <h6 class="card-title">Add ranger</h6>
      <div class="row g-2 align-items-end">
        <div class="col-md-4">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" [(ngModel)]="newRanger.name">
        </div>
        <div class="col-md-4">
          <label class="form-label">Contact</label>
          <input type="text" class="form-control" [(ngModel)]="newRanger.contact">
        </div>
        <div class="col-md-4">
          <button class="btn btn-primary w-100" [disabled]="creating || !newRanger.name.trim()" (click)="createRanger()">
            <i class="bi bi-plus-lg me-1"></i>{{ creating ? 'Adding...' : 'Add ranger' }}
          </button>
        </div>
      </div>
      <div *ngIf="errorMessage" class="alert alert-danger mt-3 mb-0">{{ errorMessage }}</div>
    </div>
  </div>

  <ag-grid-angular
    class="w-100"
    style="height: 400px;"
    [rowData]="rangers"
    [columnDefs]="colDefs"
    [theme]="theme">
  </ag-grid-angular>
</div>
