<div class="container-fluid py-3">
  <h4 class="mb-3"><i class="bi bi-geo-alt me-2"></i>Cameras</h4>
  <ag-grid-angular
    class="w-100 mb-4"
    style="height: 300px;"
    [rowData]="cameras"
    [columnDefs]="cameraColDefs"
    [theme]="theme"
    [rowSelection]="'single'"
    (selectionChanged)="onCameraSelected($event)">
  </ag-grid-angular>

  <div *ngIf="selectedCamera">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="mb-0">Images from {{ selectedCamera.name }}</h5>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="unprocessedOnly" [(ngModel)]="unprocessedOnly" (ngModelChange)="onUnprocessedToggle()">
        <label class="form-check-label" for="unprocessedOnly">Unprocessed only</label>
      </div>
    </div>
    <ag-grid-angular
      class="w-100"
      style="height: 400px;"
      [rowData]="images"
      [columnDefs]="imageColDefs"
      [theme]="theme"
      [context]="gridContext">
    </ag-grid-angular>
  </div>

  <p *ngIf="!selectedCamera" class="text-muted">Select a camera above to view its images.</p>
</div>
