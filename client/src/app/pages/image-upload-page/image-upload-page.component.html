<div class="container py-3" style="max-width: 640px;">
  <h4 class="mb-3"><i class="bi bi-cloud-upload me-2"></i>Upload image</h4>

  <div class="mb-3">
    <label class="form-label">Camera</label>
    <select class="form-select" [(ngModel)]="selectedCameraId">
      <option [ngValue]="null" disabled>Select a camera</option>
      <option *ngFor="let c of cameras" [ngValue]="c.camera_id">{{ c.name }}</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Image file</label>
    <input type="file" class="form-control" accept="image/jpeg,image/png" (change)="onFileSelected($event)">
  </div>

  <button class="btn btn-primary" [disabled]="!selectedCameraId || !selectedFile || uploading" (click)="upload()">
    <i class="bi bi-upload me-1"></i>{{ uploading ? 'Uploading...' : 'Upload' }}
  </button>

  <div *ngIf="errorMessage" class="alert alert-danger mt-3">{{ errorMessage }}</div>

  <div *ngIf="uploadedImage" class="mt-4">
    <h5>Uploaded</h5>
    <img [src]="imageUrl()" class="img-fluid img-thumbnail mb-3" style="max-height: 300px;">
    <div>
      <button class="btn btn-outline-primary" [disabled]="detecting" (click)="runDetection()">
        <i class="bi bi-cpu me-1"></i>{{ detecting ? 'Running detection...' : 'Detect now' }}
      </button>
    </div>
    <div *ngIf="detectionResult" class="alert alert-success mt-3">
      <i class="bi bi-check-circle me-1"></i>
      Predicted <strong>{{ detectionResult.species_name }}</strong> with {{ (detectionResult.confidence * 100).toFixed(1) }}% confidence
    </div>
  </div>
</div>
